name: Nightly kernel maintenance

# Rebases the two Edera kernel integration trees every night, in parallel
# (upstream-rebase.yml, once per tree):
#
#   - edera/mainline onto torvalds master;
#   - edera/6.18-lts onto stable linux-6.18.y.
#
# Claude does the rebases. Independent checks decide whether each result is
# pushed or proposed as a pull request; see upstream-rebase.yml.
#
# GitHub runs scheduled workflows only from the default branch, edera/mainline,
# so this copy runs for both trees.
#
# Repository configuration this needs:
#   vars.REBASE_APP_CLIENT_ID, secrets.REBASE_APP_PRIVATE_KEY
#       A GitHub App installed on this repository with contents, pull requests
#       and workflows write, allowed to bypass the protection rules on
#       edera/mainline and edera/6.18-lts. GITHUB_TOKEN cannot do this job: it cannot push
#       commits that touch .github/workflows/ (every rebase rewrites the ones
#       that add them), and pull requests it opens do not trigger other
#       workflows.
#   vars.REBASE_FEDERATION_RULE_ID
#       The workload identity federation rule for the rebase. It must accept
#       this workflow's OIDC subject (a scheduled or dispatched run).
#   vars.ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID,
#   ANTHROPIC_WORKSPACE_ID
#       The rest of the Claude API federation identity.

on:
  schedule:
    - cron: '23 3 * * *' # 03:23 UTC nightly
  workflow_dispatch:
    inputs:
      only:
        description: Rebase one tree instead of both
        type: choice
        options: [all, mainline, 6.18-lts]
        default: all
      force:
        description: Rebase even if an open rebase pull request already covers this upstream tip
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kernel-nightly
  cancel-in-progress: false

jobs:
  mainline:
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == 'mainline'
    uses: ./.github/workflows/upstream-rebase.yml
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    with:
      downstream: edera/mainline
      key: mainline
      upstream_url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      upstream_branch: master
      force: ${{ inputs.force == true }}
    secrets: inherit

  lts:
    if: inputs.only == '' || inputs.only == 'all' || inputs.only == '6.18-lts'
    uses: ./.github/workflows/upstream-rebase.yml
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    with:
      downstream: edera/6.18-lts
      key: 6.18-lts
      upstream_url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      upstream_branch: linux-6.18.y
      force: ${{ inputs.force == true }}
    secrets: inherit
