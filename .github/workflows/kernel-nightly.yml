name: Nightly kernel maintenance

# Keeps edera/6.18-lts current:
#
#   - nightly, rebases it onto stable linux-6.18.y (upstream-rebase.yml), then
#     retries waiting backports and refreshes the backport pull requests the
#     rebase left behind (retry-backports.sh);
#   - with backport_pr set, proposes the backport of that merged
#     edera/mainline pull request instead (lts-backport.yml).
#     lts-backport-trigger.yml on edera/mainline dispatches this for every
#     pull request that merges there.
#
# Claude does the rebase and the backports. Independent checks decide what
# happens to each result; see those workflows.
#
# GitHub runs scheduled workflows only from the default branch, edera/mainline,
# so this copy has no schedule of its own. lts-rebase-trigger.yml on
# edera/mainline dispatches it nightly; this file and the one on
# edera/mainline share a path, which is how that dispatch finds this copy.
#
# Repository configuration this needs:
#   vars.REBASE_APP_CLIENT_ID, secrets.REBASE_APP_PRIVATE_KEY
#       A GitHub App installed on this repository with contents, pull requests
#       and workflows write, allowed to bypass the protection rules on
#       edera/6.18-lts. GITHUB_TOKEN cannot do this job: it cannot push
#       commits that touch .github/workflows/ (every rebase rewrites the ones
#       that add them), and pull requests it opens do not trigger other
#       workflows.
#   vars.REBASE_FEDERATION_RULE_ID
#       The workload identity federation rule for the rebase. It must accept
#       this workflow's OIDC subject (a dispatched run on edera/6.18-lts).
#   vars.ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID,
#   ANTHROPIC_WORKSPACE_ID
#       The rest of the Claude API federation identity.

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebase even if an open rebase pull request already covers this upstream tip
        type: boolean
        default: false
      backport_pr:
        description: Instead of the rebase, backport this merged edera/mainline pull request (its number)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Per tree: groups are repository-wide, and edera/mainline's copy of this
  # workflow uses plain kernel-nightly. Each backport has its own group, so
  # they run alongside the rebase and each other; a newer dispatch for the
  # same pull request replaces one still queued.
  group: kernel-nightly-edera/6.18-lts${{ inputs.backport_pr != '' && format('-backport-{0}', inputs.backport_pr) || '' }}
  cancel-in-progress: false

jobs:
  lts:
    if: inputs.backport_pr == ''
    uses: ./.github/workflows/upstream-rebase.yml
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    with:
      downstream: edera/6.18-lts
      key: 6.18-lts
      upstream_url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
      upstream_branch: linux-6.18.y
      force: ${{ inputs.force == true }}
    secrets: inherit

  # After the rebase, whatever it did.
  retry:
    needs: lts
    if: always() && inputs.backport_pr == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Retry and refresh backports
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/retry-backports.sh --stale

  backport:
    if: inputs.backport_pr != ''
    uses: ./.github/workflows/lts-backport.yml
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
      id-token: write
    with:
      pr: ${{ inputs.backport_pr }}
    secrets: inherit
